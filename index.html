<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pink Stardust Christmas Tree</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030104;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.heading{position:absolute;top:5%;width:100%;text-align:center;color:#e9b5c9;letter-spacing:4px;font-size:11px;pointer-events:none}.controls{position:absolute;bottom:5%;left:0;right:0;display:flex;justify-content:center;gap:10px}button{border:1px solid #ab738e;border-radius:30px;background:#321625dd;color:#ffe2ed;padding:12px 16px;cursor:pointer}button:hover{background:#65334d}</style></head><body><div class="heading">PINK STARDUST · CHRISTMAS</div><canvas id="scene"></canvas><div class="controls"><button id="replay">↻ 重新生长</button><button id="pause">Ⅱ 暂停</button><button id="burst">✧ 星光</button></div><script>
(()=>{'use strict';const c=document.querySelector('#scene'),g=c.getContext('2d');let w,h,pts=[],snow=[],fire=[],progress=0,rot=0,paused=false,last=0,drag=false,lx=0,travel=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x));function init(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);pts=[];for(let i=0;i<3200;i++){let t=Math.random(),r=Math.sqrt(Math.random())*(1-t),a=rand(0,Math.PI*2),frill=Math.pow(Math.max(0,Math.sin(t*15*Math.PI)),2)*.16;pts.push({t,r:r*(1+frill),a,phase:rand(0,7),size:rand(.45,1.65),delay:t*.76+rand(0,.18),gold:Math.random()<.18});}snow=Array.from({length:70},()=>({x:rand(0,w),y:rand(0,h),s:rand(.2,.7),r:rand(.4,1.1)}));}function burst(x,y){for(let i=0;i<75;i++){let a=rand(0,7),v=rand(.7,3.5);fire.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1});}}function frame(ms){let dt=Math.min(ms-last||16,40);last=ms;if(!paused){progress=Math.min(1,progress+dt/7600);rot+=dt*.00017;}let bg=g.createRadialGradient(w*.5,h*.52,0,w*.5,h*.52,h*.7);bg.addColorStop(0,'#200b19');bg.addColorStop(.7,'#09040a');bg.addColorStop(1,'#020103');g.fillStyle=bg;g.fillRect(0,0,w,h);for(let s of snow){if(!paused){s.y+=s.s*dt*.045;if(s.y>h)s.y=0;}g.fillStyle='rgba(255,222,237,.38)';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();}let H=Math.min(h*.67,w*1.32),R=Math.min(w*.40,H*.48),base=h*.81;g.globalCompositeOperation='lighter';for(let p of pts){let v=clamp((progress-p.delay)*12);if(v<=0)continue;let a=p.a+rot,depth=Math.sin(a),x=w*.5+Math.cos(a)*p.r*R,y=base-p.t*H+depth*p.r*R*.075;let alpha=v*(.48+.35*(.5+.5*Math.sin(ms*.0025+p.phase)))*(.7+.3*(depth+1)/2),sz=p.size*(.7+.4*(depth+1)/2);g.fillStyle=p.gold?`rgba(255,212,171,${alpha})`:`rgba(255,177,211,${alpha})`;g.beginPath();g.arc(x,y,sz,0,7);g.fill();if(p.size>1.35){g.fillStyle=`rgba(255,180,218,${alpha*.10})`;g.beginPath();g.arc(x,y,sz*3,0,7);g.fill();}}if(progress>.88){let alpha=clamp((progress-.88)*9),x=w*.5,y=base-H,halo=g.createRadialGradient(x,y,0,x,y,37);halo.addColorStop(0,`rgba(255,249,241,${alpha})`);halo.addColorStop(1,'rgba(255,162,205,0)');g.fillStyle=halo;g.beginPath();g.arc(x,y,37,0,7);g.fill();g.strokeStyle=`rgba(255,236,240,${alpha})`;g.lineWidth=1.5;for(let i=0;i<8;i++){let a=i*Math.PI/4;g.beginPath();g.moveTo(x+Math.cos(a)*3,y+Math.sin(a)*3);g.lineTo(x+Math.cos(a)*14,y+Math.sin(a)*14);g.stroke();}}for(let i=fire.length-1;i>=0;i--){let p=fire[i];if(!paused){p.x+=p.vx*dt*.055;p.y+=p.vy*dt*.055;p.life-=dt*.0012;}if(p.life<=0){fire.splice(i,1);continue;}g.fillStyle=`rgba(255,194,221,${p.life})`;g.beginPath();g.arc(p.x,p.y,1.8*p.life,0,7);g.fill();}g.globalCompositeOperation='source-over';requestAnimationFrame(frame);}c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;travel=0;c.setPointerCapture(e.pointerId);});c.addEventListener('pointermove',e=>{if(drag){let dx=e.clientX-lx;travel+=Math.abs(dx);rot+=dx*.009;lx=e.clientX;}});c.addEventListener('pointerup',e=>{drag=false;if(travel<8){let b=c.getBoundingClientRect();burst(e.clientX-b.left,e.clientY-b.top);}});document.querySelector('#replay').onclick=()=>{progress=0;fire=[];};document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 继续':'Ⅱ 暂停';};document.querySelector('#burst').onclick=()=>burst(rand(w*.25,w*.75),rand(h*.25,h*.65));addEventListener('resize',init);init();requestAnimationFrame(frame);})();
</script></body></html>
